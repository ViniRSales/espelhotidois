spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

doapp:
  jwt:
    segredo: ${JWT_SEGREDO:chave-de-desenvolvimento-do-doapp-nao-use-em-producao}
  recuperacao-senha:
    registrar-link-no-log: true
